<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="tablestyle.css" />
    <title>Table Creation</title>
  </head>
  <body>
    <main>
      <table class="table">
        <caption class="title">
          Available Products
        </caption>
        <thead>
          <tr>
            <th>Product Name</th>
            <th>Price</th>
            <th>In Stock</th>
          </tr>
        </thead>

        <tbody>
          <tr>
            <td>Chair</td>
            <td>2000</td>
            <td>yes</td>
          </tr>
          <tr>
            <td>Keyboard</td>
            <td>500</td>
            <td>yes</td>
          </tr>
          <tr>
            <td>Iphone</td>
            <td>10000</td>
            <td>yess</td>
          </tr>
        </tbody>
      </table>
      <button class="click">Submit</button>
    </main>
  </body>
</html>
